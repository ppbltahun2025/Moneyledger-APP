<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MoneyLedger — Mulai</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login-screen">
    <div class="login-card" style="width:440px;">
      <p class="display">Money<em style="color:var(--gold)">Ledger</em></p>
      <p>Catat pemasukan &amp; pengeluaran, pantau target, dan bangun literasi keuanganmu.</p>

      <div style="display:flex; flex-direction:column; gap:10px; margin-top:8px;">
        <button onclick="continueAsGuest()">Lanjutkan tanpa akun</button>
        <button class="secondary" onclick="window.location.href='register.html'">Buat akun baru</button>
        <button class="secondary" onclick="window.location.href='login.html'">Sudah punya akun — Masuk</button>
      </div>

      <p style="margin-top:24px; font-size:12px; text-align:left;">
        <b>Tanpa akun:</b> data tersimpan hanya di perangkat/browser ini (hilang kalau cache dibersihkan).<br><br>
        <b>Buat akun:</b> data tersimpan permanen di server, bisa dibuka lagi dari device manapun setelah verifikasi email.
      </p>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/store.js"></script>
  <script>
    initAuthPage();
    if (Store.isLoggedIn()) window.location.href = 'dashboard.html';

    function continueAsGuest() {
      Store.startGuest();
      window.location.href = 'dashboard.html';
    }
  </script>
</body>
</html>
