<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Masuk — MoneyLedger</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login-screen">
    <div class="login-card" style="width:400px; text-align:left;">
      <p class="display" style="text-align:center;">Masuk</p>

      <form class="stacked" id="login-form">
        <input type="text" id="login-identifier" placeholder="Username atau email" required>
        <input type="password" id="login-password" placeholder="Password" required>
        <button type="submit">Masuk</button>
      </form>

      <p id="login-message" style="font-size:13px; margin-top:14px; color:var(--rust);"></p>
      <p style="font-size:13px; margin-top:18px; text-align:center;">
        Belum punya akun? <a href="register.html">Daftar</a> · <a href="index.html">Kembali</a>
      </p>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/store.js"></script>
  <script>
    initAuthPage();
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('login-message');
      msg.style.color = 'var(--ink-soft)';
      msg.textContent = 'Memproses...';
      const btn = e.target.querySelector('button[type=submit]'); btn.disabled = true;

      try {
        const res = await backendCall('login', {
          identifier: document.getElementById('login-identifier').value.trim(),
          password: document.getElementById('login-password').value
        });
        const hadGuestData = Store.hasGuestData();
        Store.setAccountSession(res.user);

        if (hadGuestData && confirm('Kamu punya data mode Tamu di device ini. Pindahkan ke akun ini sekarang?')) {
          msg.textContent = 'Memindahkan data...';
          await Store.migrateGuestDataToAccount();
        }
        window.location.href = 'dashboard.html';
      } catch (err) {
        msg.style.color = 'var(--rust)';
        msg.textContent = 'Gagal masuk: ' + err.message;
        btn.disabled = false; shakeCard();
      }
    });
  </script>
</body>
</html>
