name: Fetch News

on:
  schedule:
    # Setiap hari jam 23:00 UTC (= 06:00 WIB keesokan harinya)
    - cron: '0 23 * * *'
  workflow_dispatch: {}   # supaya bisa dijalankan manual dari tab Actions

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Fetch latest news
        run: npm run fetch-news

      - name: Commit updated articles.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/articles.json
          git diff --cached --quiet || git commit -m "chore: update news feed"
          git push
