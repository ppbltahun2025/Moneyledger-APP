<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buat Akun — MoneyLedger</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login-screen">
    <div class="login-card" style="width:400px; text-align:left;">
      <p class="display" style="text-align:center;">Buat Akun</p>
      <p style="text-align:center;">Akun untuk menyimpan data keuanganmu secara permanen.</p>

      <form class="stacked" id="register-form">
        <input type="text" id="reg-username" placeholder="Username" required minlength="3">
        <input type="email" id="reg-email" placeholder="Email" required>
        <input type="password" id="reg-password" placeholder="Password (min. 6 karakter)" required minlength="6">
        <input type="password" id="reg-password2" placeholder="Ulangi password" required minlength="6">
        <button type="submit">Daftar</button>
      </form>

      <p id="reg-message" style="font-size:13px; margin-top:14px;"></p>
      <p style="font-size:13px; margin-top:18px; text-align:center;">
        Sudah punya akun? <a href="login.html">Masuk di sini</a> · <a href="index.html">Kembali</a>
      </p>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/store.js"></script>
  <script>
    initAuthPage();
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('reg-message');
      msg.style.color = 'var(--ink-soft)';
      msg.textContent = 'Memproses...';
      const btn = e.target.querySelector('button[type=submit]');

      const password = document.getElementById('reg-password').value;
      const password2 = document.getElementById('reg-password2').value;
      if (password !== password2) {
        msg.style.color = 'var(--rust)';
        msg.textContent = 'Password dan ulangi password tidak sama.';
        shakeCard();
        return;
      }

      btn.disabled = true;
      try {
        const res = await backendCall('register', {
          username: document.getElementById('reg-username').value.trim(),
          email: document.getElementById('reg-email').value.trim(),
          password
        });
        msg.style.color = 'var(--primary)';
        msg.textContent = res.message + ' Setelah verifikasi, kembali ke halaman Masuk.';
        document.getElementById('register-form').reset();
        Sound.coin();
      } catch (err) {
        msg.style.color = 'var(--rust)';
        msg.textContent = 'Gagal daftar: ' + err.message;
        shakeCard();
      } finally { btn.disabled = false; }
    });
  </script>
</body>
</html>
