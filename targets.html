<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Target — MoneyLedger</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="layout">
  <div id="sidebar-root"></div>
  <div class="main">
    <h1 class="page-title">Target Pemasukan</h1>
    <p class="page-sub">Atur target bulanan dan tahunan — progres muncul otomatis di Dashboard.</p>

    <div class="two-col">
      <div class="card">
        <div class="stat-label">Target bulanan</div>
        <form class="stacked" id="monthly-form">
          <input type="month" id="monthly-period" required>
          <input type="number" id="monthly-amount" placeholder="Target (Rp)" min="0" required>
          <button type="submit">Simpan target bulanan</button>
        </form>
      </div>
      <div class="card">
        <div class="stat-label">Target tahunan</div>
        <form class="stacked" id="yearly-form">
          <input type="number" id="yearly-period" placeholder="Tahun (misal 2026)" min="2000" required>
          <input type="number" id="yearly-amount" placeholder="Target (Rp)" min="0" required>
          <button type="submit">Simpan target tahunan</button>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/store.js"></script>
<script src="js/layout.js"></script>
<script src="js/targets.js"></script>
</body>
</html>
