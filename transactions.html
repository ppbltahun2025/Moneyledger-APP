<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transaksi — MoneyLedger</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="layout">
  <div id="sidebar-root"></div>
  <div class="main">
    <h1 class="page-title">Transaksi</h1>
    <p class="page-sub">Catat setiap pemasukan dan pengeluaran. Klik dua kali pada baris untuk mengubah langsung, atau pakai ikon di kanan untuk menghapus.</p>

    <div class="card">
      <form class="wide" id="tx-form">
        <label class="field-label">Jenis
          <select id="tx-type" required><option value="income">Pemasukan</option><option value="expense">Pengeluaran</option></select></label>
        <label class="field-label">Tanggal <input type="date" id="tx-date" required></label>
        <label class="field-label">Kategori <input type="text" id="tx-category" list="cat-list" placeholder="Gaji, Makan, Transport" required autocomplete="off"></label>
        <label class="field-label">Jumlah (Rp) <input type="number" id="tx-amount" placeholder="50000" min="0" required></label>
        <label class="field-label">Catatan <input type="text" id="tx-note" placeholder="Opsional"></label>
        <button type="submit">Simpan transaksi</button>
      </form>
      <datalist id="cat-list"><option>Gaji</option><option>Makan</option><option>Transport</option><option>Belanja</option><option>Tagihan</option><option>Investasi</option><option>Hiburan</option></datalist>
    </div>

    <div class="section-title"><span>Semua transaksi</span><small id="tx-summary" style="font-weight:400"></small></div>
    <div class="toolbar">
      <input type="search" id="tx-search" placeholder="Cari kategori atau catatan…" aria-label="Cari transaksi">
      <div class="chips" style="margin:0">
        <button class="chip on" data-type="all">Semua</button>
        <button class="chip" data-type="income">Pemasukan</button>
        <button class="chip" data-type="expense">Pengeluaran</button>
      </div>
    </div>
    <div class="ledger" id="full-ledger"></div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/store.js"></script>
<script src="js/layout.js"></script>
<script src="js/ledger.js"></script>
<script src="js/transactions.js"></script>
</body>
</html>
