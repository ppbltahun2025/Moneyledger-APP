<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Berita & Pasar — MoneyLedger</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="layout">
  <div id="sidebar-root"></div>
  <div class="main">
    <h1 class="page-title">Berita & Pasar</h1>
    <p class="page-sub" id="updated-label">Memuat arsip berita…</p>

    <div class="toolbar">
      <input type="search" id="n-search" placeholder="Cari kata kunci: emas, nikel, Selat Hormuz, IHSG…" aria-label="Cari berita">
      <label class="field-label">Dari tanggal <input type="date" id="n-from"></label>
      <label class="field-label">Sampai <input type="date" id="n-to"></label>
      <label class="field-label">Wilayah
        <select id="n-region"><option value="">Semua</option><option value="id">Dalam negeri</option><option value="intl">Luar negeri</option></select></label>
    </div>
    <div class="chips" id="n-cats"></div>
    <div class="chips" id="n-quick">
      <button class="chip" data-range="0">Hari ini</button>
      <button class="chip" data-range="1">Kemarin</button>
      <button class="chip" data-range="7">7 hari</button>
      <button class="chip" data-range="30">30 hari</button>
      <button class="chip on" data-range="all">Semua tanggal</button>
    </div>

    <div class="section-title">
      <span id="n-count"></span>
      <button class="secondary small" id="n-backup">Backup hasil ini ke spreadsheet</button>
    </div>
    <div id="article-list"></div>
    <button class="secondary" id="n-more" hidden style="margin:8px auto;display:block">Muat lebih banyak</button>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/store.js"></script>
<script src="js/layout.js"></script>
<script src="js/articles.js"></script>
</body>
</html>
